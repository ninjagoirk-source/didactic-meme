name: Build weather APK

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/flutter_application_pogoda/**'
      - '.github/workflows/build-weather.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .devcontainer/flutter_application_pogoda
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../../weather.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: weather-latest
          name: Weather APK
          files: weather.apk