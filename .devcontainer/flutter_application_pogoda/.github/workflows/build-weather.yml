name: Build Weather App

on:
  push:
    paths:
      - 'apps/weather/**'
  pull_request:
    paths:
      - 'apps/weather/**'

jobs:
  build:
    runs-on: ubuntu-latest

    # Даем права на запись, чтобы GitHub Actions мог создать релиз и загрузить APK
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
          cache: true

      - name: Install dependencies
        run: |
          cd apps/weather
          flutter pub get

      - name: Build APK
        run: |
          cd apps/weather
          flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Release v1.0.0
          files: apps/weather/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
