name: Build Weather App

on:
  push:
    paths:
      - '.devcontainer/flutter_application_pogoda/**'
  pull_request:
    paths:
      - '.devcontainer/flutter_application_pogoda/**'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
          cache: true

      - name: Install dependencies
        run: |
          cd .devcontainer/flutter_application_pogoda
          flutter pub get

      - name: Build APK
        run: |
          cd .devcontainer/flutter_application_pogoda
          flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Release v1.0.0
          files: .devcontainer/flutter_application_pogoda/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
